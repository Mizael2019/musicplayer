<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.css"
    />
    <title>Music Player</title>
  </head>
  <body>
    <div class="bg" aria-hidden="true">
      <div class="bg-layer active" id="bg-a"></div>
      <div class="bg-layer" id="bg-b"></div>
    </div>
    <main class="app" id="app">
      <audio id="audio"></audio>

      <!-- Tela: Tocando agora -->
      <section class="screen screen-player" id="screen-player">
        <header class="topbar">
          <button class="icon-btn" id="show-list" aria-label="Playlist">
            <i class="fa fa-angle-left"></i>
          </button>
          <h1>Tocando agora</h1>
          <span class="topbar-spacer"></span>
        </header>

        <div class="disc" id="disc">
          <img id="cover" alt="Capa da música" />
        </div>

        <div class="progress-wrap">
          <canvas class="visualizer" id="visualizer" aria-hidden="true"></canvas>
          <div class="progress-container" id="progress-container">
            <div class="progress" id="progress"><span class="knob"></span></div>
          </div>
          <div class="times">
            <span id="current-time">0:00</span>
            <span id="remaining-time">-0:00</span>
          </div>
        </div>

        <div class="track-row">
          <div class="track-text">
            <h2 id="title"></h2>
            <p id="artist"></p>
          </div>
          <div class="track-actions">
            <button class="icon-btn" id="shuffle" aria-label="Aleatório">
              <i class="fa fa-random"></i>
            </button>
            <button class="icon-btn" id="repeat" aria-label="Repetir">
              <i class="fa fa-repeat"></i>
            </button>
            <button class="round-btn small" id="like" aria-label="Favoritar">
              <i class="fa fa-heart"></i>
            </button>
          </div>
        </div>

        <div class="navigation">
          <button class="round-btn" id="prev" aria-label="Anterior">
            <i class="fa fa-step-backward"></i>
          </button>
          <button class="round-btn big" id="play" aria-label="Tocar">
            <i class="fa fa-play"></i>
          </button>
          <button class="round-btn" id="next" aria-label="Próxima">
            <i class="fa fa-step-forward"></i>
          </button>
        </div>
      </section>

      <!-- Tela: Lista de músicas -->
      <section class="screen screen-list" id="screen-list">
        <header class="topbar">
          <button class="icon-btn" id="show-player" aria-label="Voltar ao player">
            <i class="fa fa-angle-left"></i>
          </button>
          <h1>Playlist</h1>
          <span class="topbar-spacer"></span>
        </header>
        <h3 class="section-title">Músicas</h3>
        <ul class="song-list" id="song-list"></ul>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
